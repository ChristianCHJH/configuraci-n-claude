}

const ICONOS = {

  tienda: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 9l1.5-5h13L20 9"/><path d="M4 9h16v2a3 3 0 0 1-5.3 2 3 3 0 0 1-5.4 0A3 3 0 0 1 4 11z"/><path d="M5 13v7h14v-7"/><path d="M10 20v-4h4v4"/></svg>',

};

const ILUSTRACIONES = {
  'taza-1': ['taza', '#E8D9C6', '#2C5C87', '#F3ECE2'],
  'taza-2': ['taza', '#CFE0D6', '#B5532F', '#F6EFE6'],
  'cafe-1': ['cafe', '#E9DFCF', '#2E4A3B', '#F2E6CF'],

};

function ilustracion(clave) {
  const [forma, fondo, principal, detalle] = ILUSTRACIONES[clave] || ['taza', '#DDE5DF', '#5B6962', '#EEF1EC'];
  const figuras = {
    taza: `<ellipse cx="200" cy="300" rx="132" ry="24" fill="${detalle}"/><path d="M118 150h152v108a42 42 0 0 1-42 42h-68a42 42 0 0 1-42-42z" fill="${principal}"/><path d="M270 178a38 38 0 0 1 0 76" fill="none" stroke="${principal}" stroke-width="18"/><ellipse cx="194" cy="150" rx="76" ry="13" fill="${detalle}"/><circle cx="152" cy="214" r="9" fill="${detalle}"/><circle cx="194" cy="232" r="9" fill="${detalle}"/><circle cx="236" cy="214" r="9" fill="${detalle}"/>`,
    cafe: `<path d="M138 112h124l22 208H116z" fill="${principal}"/><rect x="146" y="96" width="108" height="24" rx="5" fill="${principal}" opacity=".75"/><rect x="152" y="178" width="96" height="74" rx="10" fill="${detalle}"/><ellipse cx="200" cy="215" rx="16" ry="22" fill="#5A3622"/><path d="M200 196q-6 19 0 38" stroke="${detalle}" stroke-width="3" fill="none"/><ellipse cx="300" cy="300" rx="14" ry="19" fill="#5A3622" transform="rotate(30 300 300)"/><ellipse cx="96" cy="310" rx="14" ry="19" fill="#5A3622" transform="rotate(-25 96 310)"/>`,
    chompa: `<path d="M152 104l-66 40 26 78 30-14v130h116V208l30 14 26-78-66-40q-48 30-96 0z" fill="${principal}"/><rect x="142" y="246" width="116" height="12" fill="${detalle}"/><rect x="142" y="270" width="116" height="12" fill="${detalle}"/><path d="M168 108q32 22 64 0" fill="none" stroke="${detalle}" stroke-width="6"/>`
  };
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="${fondo}"/>${figuras[forma]}</svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

const EJEMPLOS_LOCALES = [
  { id: 'ejemplo-chompa', nombre: 'Chompa de baby alpaca', descripcion: 'Tejida en Arequipa con hilo 100 % baby alpaca.\nTallas S a L, color gris perla.', precio: 189.9, imagenes: ['ejemplo:chompa-1', 'ejemplo:chompa-2', 'ejemplo:chompa-3'], ejemplo: true, creado: '2026-10-04T15:20:00.000Z' },
  { id: 'ejemplo-cafe', nombre: 'Café de altura Villa Rica 250 g', descripcion: 'Grano de tueste medio con notas de chocolate y panela. Se entrega entero o molido, a pedido.', precio: 32.5, imagenes: ['ejemplo:cafe-1'], ejemplo: true, creado: '2026-10-03T12:05:00.000Z' },
  { id: 'ejemplo-taza', nombre: 'Taza de cerámica de Chulucanas', descripcion: 'Pintada a mano por artesanos de Piura. Capacidad de 350 ml, apta para lavavajillas.', precio: 38, imagenes: ['ejemplo:taza-1', 'ejemplo:taza-2'], ejemplo: true, creado: '2026-10-02T09:40:00.000Z' }
];

const VISTA_DE_SECCION = { tienda: 'lista', catalogo: 'catalogo', admin: 'negocios' };

function seccionGuardada() {
  try {
    const guardada = localStorage.getItem(CLAVE_SECCION);
    return VISTA_DE_SECCION[guardada] ? guardada : 'tienda';
  } catch { return 'tienda'; }
}

const estado = {
  productos: [],
  cargando: true,
  negocios: [],
  cargandoNegocios: true,
  modo: null,
  puedeEditar: true,
  vista: { nombre: VISTA_DE_SECCION[seccionGuardada()] },
  busqueda: '',
  busquedaNegocios: '',
  form: null,
  formNegocio: null,
  hoja: null,
  ocupado: false
};
let almacenes = null;
let activos = null;
let temporizadorAviso = null;

function esc(texto) {
  return String(texto ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function precioHtml(monto) {
  return `<span class="moneda">S/</span>${formatoMonto.format(Number(monto) || 0)}`;
}

function fuente(ref) {
  if (ref.startsWith('data:') || ref.startsWith('blob:')) return ref;
  if (ref.startsWith('ejemplo:')) return ilustracion(ref.slice(8));
  return '/_blob/' + ref;
}

function productoPorId(id) {
  return estado.productos.find(p => p.id === id) || null;
}

function negocioPorId(id) {
  return estado.negocios.find(n => n.id === id) || null;
}

function aviso(mensaje) {
  clearTimeout(temporizadorAviso);
  avisoVivo.innerHTML = `<div class="aviso" role="status">${esc(mensaje)}</div>`;
  temporizadorAviso = setTimeout(() => { avisoVivo.innerHTML = ''; }, 2800);
}

function htmlSecciones(actual) {
  return `<nav class="secciones" aria-label="Sección">
    <button type="button" data-accion="seccion" data-seccion="tienda" aria-pressed="${actual === 'tienda'}">Tienda</button>
    <button type="button" data-accion="seccion" data-seccion="catalogo" aria-pressed="${actual === 'catalogo'}">Catálogo web</button>
    <button type="button" data-accion="seccion" data-seccion="admin" aria-pressed="${actual === 'admin'}">Administración</button>
  </nav>`;
}

function htmlAvisoLocal() {
  return estado.modo === 'local' ? '<p class="aviso-local">Estás en modo local: los datos se guardan solo en este navegador.</p>' : '';
}

function fotoPortada(producto) {
  const ref = producto.imagenes?.[0];
  if (!ref) return `<div class="sin-foto">${ICONOS.imagen}</div>`;
  return `<img src="${esc(fuente(ref))}" alt="${esc(producto.nombre)}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'sin-foto',innerHTML:ICONOS.imagen}))">`;
}

function htmlTarjeta(p) {
  const total = p.imagenes?.length || 0;
  return `<button class="tarjeta" data-accion="ver" data-id="${esc(p.id)}">
    <div class="foto-caja">
      ${fotoPortada(p)}
      ${p.ejemplo ? '<span class="chip chip-ejemplo">Ejemplo</span>' : ''}
      ${total > 1 ? `<span class="chip chip-fotos">${ICONOS.fotos}${total}</span>` : ''}
    </div>
    <div class="tarjeta-texto">
      <h2>${esc(p.nombre)}</h2>
      <p class="precio">${precioHtml(p.precio)}</p>
    </div>
  </button>`;
}

function htmlRejilla() {
  if (estado.cargando) {
    return `<div class="rejilla" aria-label="Cargando productos">${'<div class="esqueleto"></div>'.repeat(4)}</div>`;
  }
  if (!estado.productos.length) {
    return `<div class="vacio">
      <div class="vacio-icono">${ICONOS.caja}</div>
      <h2>Tu vitrina está vacía</h2>
      <p>Registra tu primer producto con fotos, descripción y precio.</p>
      ${estado.puedeEditar ? `<button class="boton primario" data-accion="nuevo">${ICONOS.mas}Registrar producto</button>` : ''}
    </div>`;
  }
  const termino = estado.busqueda.trim().toLowerCase();
  const visibles = termino ? estado.productos.filter(p => p.nombre.toLowerCase().includes(termino)) : estado.productos;
  if (!visibles.length) {
    return `<div class="vacio"><p>Ningún producto se llama parecido a «${esc(estado.busqueda.trim())}».</p></div>`;
  }
  return `<div class="rejilla">${visibles.map(htmlTarjeta).join('')}</div>`;
}

function textoConteo() {
  if (estado.cargando) return 'Cargando…';
  const n = estado.productos.length;
  return n === 1 ? '1 producto' : `${n} productos`;
}

function renderLista() {
  pantalla.className = 'pantalla' + (estado.puedeEditar ? ' con-fab' : '');
  pantalla.innerHTML = `
    <header class="barra">
      <div><p class="ceja">Vitrina</p><h1>Mis productos</h1></div>
      <span class="conteo" id="conteo">${textoConteo()}</span>
    </header>
    ${htmlSecciones('tienda')}
    ${htmlAvisoLocal()}
    <label class="buscador" for="buscar">${ICONOS.lupa}<input id="buscar" type="search" placeholder="Buscar por nombre" autocomplete="off" value="${esc(estado.busqueda)}"></label>
    <main id="rejilla">${htmlRejilla()}</main>
    ${estado.puedeEditar ? `<button class="fab" data-accion="nuevo">${ICONOS.mas}Nuevo producto</button>` : ''}
  `;
}

function refrescarRejilla() {
  const rejilla = document.getElementById('rejilla');
  const conteo = document.getElementById('conteo');
  if (rejilla) rejilla.innerHTML = htmlRejilla();
  if (conteo) conteo.textContent = textoConteo();
}

function htmlTarjetaWeb(p) {
  const total = p.imagenes?.length || 0;
  return `<article class="tarjeta-web">
    <div class="foto-caja">
      ${fotoPortada(p)}
      ${p.ejemplo ? '<span class="chip chip-ejemplo">Ejemplo</span>' : ''}
      ${total > 1 ? `<span class="chip chip-fotos">${ICONOS.fotos}${total}</span>` : ''}
    </div>
    <div class="tarjeta-texto">
      <h2>${esc(p.nombre)}</h2>
      ${p.descripcion ? `<p class="resumen">${esc(p.descripcion)}</p>` : ''}
      <p class="precio">${precioHtml(p.precio)}</p>
    </div>
  </article>`;
}

function htmlRejillaWeb() {
  if (estado.cargando) {
    return `<div class="rejilla-web" aria-label="Cargando productos">${'<div class="esqueleto"></div>'.repeat(8)}</div>`;
  }
  if (!estado.productos.length) {
    return `<div class="vacio">
      <div class="vacio-icono">${ICONOS.caja}</div>
      <h2>Pronto tendremos productos</h2>
      <p>Todavía no hay productos publicados en este catálogo.</p>
    </div>`;
  }
  const termino = estado.busqueda.trim().toLowerCase();
  const visibles = termino ? estado.productos.filter(p => p.nombre.toLowerCase().includes(termino)) : estado.productos;
  if (!visibles.length) {
    return `<div class="vacio"><p>Ningún producto se llama parecido a «${esc(estado.busqueda.trim())}».</p></div>`;
  }
  return `<div class="rejilla-web">${visibles.map(htmlTarjetaWeb).join('')}</div>`;
}

function renderCatalogo() {
  pantalla.className = 'pantalla';
  pantalla.innerHTML = `
    <header class="web-cabecera">
      <div class="web-marco web-cabecera-fila">
        <div><p class="ceja">Catálogo</p><h1>Nuestros productos</h1></div>
        ${htmlSecciones('catalogo')}
      </div>
    </header>
    <div class="web-marco">
      <div class="web-herramientas">
        <label class="buscador" for="buscar-web">${ICONOS.lupa}<input id="buscar-web" type="search" placeholder="Buscar por nombre" autocomplete="off" value="${esc(estado.busqueda)}"></label>
        <span class="conteo" id="conteo-web">${textoConteo()}</span>
      </div>
      <main id="rejilla-web">${htmlRejillaWeb()}</main>
    </div>
  `;
}

function refrescarCatalogo() {
  const rejilla = document.getElementById('rejilla-web');
  const conteo = document.getElementById('conteo-web');
  if (rejilla) rejilla.innerHTML = htmlRejillaWeb();
  if (conteo) conteo.textContent = textoConteo();
}

function iniciales(nombre) {
  const palabras = String(nombre || '').trim().split(/\s+/).filter(Boolean);
  return ((palabras[0]?.[0] || '') + (palabras[1]?.[0] || '')).toUpperCase() || '·';
}

function htmlLogoMini(n) {
  if (!n.logo) return `<span class="logo-mini" aria-hidden="true">${esc(iniciales(n.nombre))}</span>`;
  return `<span class="logo-mini"><img src="${esc(fuente(n.logo))}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode(${esc(JSON.stringify(iniciales(n.nombre)))}))"></span>`;
}

function htmlFilaNegocio(n) {
  return `<button class="fila" data-accion="editar-negocio" data-id="${esc(n.id)}" aria-label="Editar ${esc(n.nombre)}">
    ${htmlLogoMini(n)}
    <span class="fila-texto">
      <h2>${esc(n.nombre)}</h2>
      <p>${esc(n.responsable)} · ${esc(n.telefono)}</p>
      <p>${esc(n.direccion)}</p>
    </span>
  </button>`;
}

function htmlListaNegocios() {
  if (estado.cargandoNegocios) {
    return `<div class="filas" aria-label="Cargando negocios">${'<div class="esqueleto fila-esqueleto"></div>'.repeat(3)}</div>`;
  }
  if (!estado.negocios.length) {
    return `<div class="vacio">
      <div class="vacio-icono">${ICONOS.tienda}</div>
      <h2>Aún no hay negocios</h2>
      <p>Registra el primero con su logo, dirección, contacto y responsable.</p>
      ${estado.puedeEditar ? `<button class="boton primario" data-accion="nuevo-negocio">${ICONOS.mas}Registrar negocio</button>` : ''}
    </div>`;
  }
  const termino = estado.busquedaNegocios.trim().toLowerCase();
  const visibles = termino
    ? estado.negocios.filter(n => n.nombre.toLowerCase().includes(termino) || (n.responsable || '').toLowerCase().includes(termino))
    : estado.negocios;
  if (!visibles.length) {
    return `<div class="vacio"><p>Ningún negocio ni responsable coincide con «${esc(estado.busquedaNegocios.trim())}».</p></div>`;
  }
  return `<div class="filas">${visibles.map(htmlFilaNegocio).join('')}</div>`;
}

function textoConteoNegocios() {
  if (estado.cargandoNegocios) return 'Cargando…';
  const n = estado.negocios.length;
  return n === 1 ? '1 negocio' : `${n} negocios`;
}

function renderNegocios() {
  pantalla.className = 'pantalla' + (estado.puedeEditar ? ' con-fab' : '');
  pantalla.innerHTML = `
    <header class="barra">
      <div><p class="ceja">Administración</p><h1>Negocios</h1></div>
      <span class="conteo" id="conteo-negocios">${textoConteoNegocios()}</span>
    </header>
    ${htmlSecciones('admin')}
    ${htmlAvisoLocal()}
    <label class="buscador" for="buscar-negocio">${ICONOS.lupa}<input id="buscar-negocio" type="search" placeholder="Buscar por negocio o responsable" autocomplete="off" value="${esc(estado.busquedaNegocios)}"></label>
    <main id="lista-negocios">${htmlListaNegocios()}</main>
    ${estado.puedeEditar ? `<button class="fab" data-accion="nuevo-negocio">${ICONOS.mas}Nuevo negocio</button>` : ''}
  `;
}

function refrescarNegocios() {
  const lista = document.getElementById('lista-negocios');
  const conteo = document.getElementById('conteo-negocios');
  if (lista) lista.innerHTML = htmlListaNegocios();
  if (conteo) conteo.textContent = textoConteoNegocios();
}

function renderDetalle() {
  const p = productoPorId(estado.vista.id);
  if (!p) { ir({ nombre: 'lista' }); return; }
  const imagenes = p.imagenes || [];
  const fecha = p.creado ? formatoFecha.format(new Date(p.creado)) : '';
  pantalla.className = 'pantalla';
  pantalla.innerHTML = `
    <header class="barra barra-sub">
      <button class="icono" data-accion="volver" aria-label="Volver a mis productos">${ICONOS.atras}</button>
      <span class="titulo-barra">Producto</span>
      ${estado.puedeEditar ? '<button class="texto-boton" data-accion="editar">Editar</button>' : '<span></span>'}
    </header>
    <div class="carrusel" id="carrusel" aria-label="Fotos del producto">
      ${imagenes.length
        ? imagenes.map((ref, i) => `<img src="${esc(fuente(ref))}" alt="${esc(p.nombre)}, foto ${i + 1} de ${imagenes.length}">`).join('')
        : `<div class="sin-foto">${ICONOS.imagen}</div>`}
    </div>
    <div class="puntos" id="puntos">${imagenes.length > 1 ? imagenes.map((_, i) => `<span class="punto${i === 0 ? ' activo' : ''}"></span>`).join('') : ''}</div>
    <section class="ficha">
      ${p.ejemplo ? '<p class="ceja">Producto de ejemplo</p>' : ''}
      <h1>${esc(p.nombre)}</h1>
      <p class="precio precio-grande">${precioHtml(p.precio)}</p>
      <h2 class="etiqueta">Descripción</h2>
      <p class="descripcion${p.descripcion ? '' : ' vacia'}">${p.descripcion ? esc(p.descripcion) : 'Sin descripción.'}</p>
      ${fecha ? `<p class="meta">Registrado el ${esc(fecha)}${p.actualizado ? ` · editado el ${esc(formatoFecha.format(new Date(p.actualizado)))}` : ''}</p>` : ''}
    </section>
    ${estado.puedeEditar ? `<div class="acciones">
      <button class="boton borrar" data-accion="pedir-eliminar">Eliminar</button>
      <button class="boton primario" data-accion="editar">Editar producto</button>
    </div>` : ''}
  `;
  const carrusel = document.getElementById('carrusel');
  carrusel.addEventListener('scroll', () => {
    const indice = Math.round(carrusel.scrollLeft / carrusel.clientWidth);
    document.querySelectorAll('#puntos .punto').forEach((punto, i) => punto.classList.toggle('activo', i === indice));
  }, { passive: true });
}

function htmlRanuras() {
  const f = estado.form;
  let html = f.imagenes.map((img, i) => `
    <div class="ranura">
      <button type="button" class="ranura-foto" data-accion="portada" data-indice="${i}" aria-label="${i === 0 ? 'Foto de portada' : `Usar la foto ${i + 1} como portada`}">

function leerPrecio(texto) {
  const limpio = String(texto).trim().replace(/\s/g, '').replace(',', '.');
  if (!/^\d+(\.\d{1,2})?$/.test(limpio)) return NaN;
  return Math.round(Number(limpio) * 100) / 100;
}

function validar() {
  const f = estado.form;
  const errores = {};
  if (!f.nombre.trim()) errores.nombre = 'Escribe el nombre del producto.';
  const precio = leerPrecio(f.precio);
  if (!f.precio.trim()) errores.precio = 'Escribe el precio.';
  else if (Number.isNaN(precio)) errores.precio = 'Usa solo números, con hasta 2 decimales. Ej.: 45.90';
  else if (precio <= 0) errores.precio = 'El precio debe ser mayor que 0.';
  f.errores = errores;
  return { valido: !Object.keys(errores).length, precio };
}

function validarNegocio() {
  const f = estado.formNegocio;
  const errores = {};
  if (!f.nombre.trim()) errores.nombre = 'Escribe el nombre del negocio.';
  if (!f.direccion.trim()) errores.direccion = 'Escribe la dirección del negocio.';
  const telefono = f.telefono.trim();
  const digitos = telefono.replace(/\D/g, '');
  if (!telefono) errores.telefono = 'Escribe un número de contacto.';
  else if (!/^\+?[\d\s()-]+$/.test(telefono) || digitos.length < 6 || digitos.length > 15) errores.telefono = 'Usa solo números, entre 6 y 15 dígitos. Ej.: 987 654 321';
  if (!f.responsable.trim()) errores.responsable = 'Escribe el nombre del responsable.';
  f.errores = errores;
  return !Object.keys(errores).length;
}

async function comprimir(archivo, lado, calidad) {
  const url = URL.createObjectURL(archivo);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    const escala = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight));
    const lienzo = document.createElement('canvas');
    lienzo.width = Math.round(img.naturalWidth * escala);
    lienzo.height = Math.round(img.naturalHeight * escala);
    const contexto = lienzo.getContext('2d');
    contexto.fillStyle = '#FFFFFF';
    contexto.fillRect(0, 0, lienzo.width, lienzo.height);
    contexto.drawImage(img, 0, 0, lienzo.width, lienzo.height);
    const blob = await new Promise(resolver => lienzo.toBlob(resolver, 'image/jpeg', calidad));
    if (!blob) throw new Error('sin-blob');
    return blob;
  } finally {
    URL.revokeObjectURL(url);
  }
}

function blobADataUrl(blob) {
  return new Promise((resolver, rechazar) => {
    const lector = new FileReader();
    lector.onload = () => resolver(lector.result);
    lector.onerror = rechazar;
    lector.readAsDataURL(blob);
  });
}

async function agregarFotos(archivos) {
  const f = estado.form;
  if (!f) return;
  const libres = MAX_FOTOS - f.imagenes.length;
  const elegidos = archivos.slice(0, libres);
  if (archivos.length > libres) aviso(`Solo caben ${MAX_FOTOS} fotos por producto. Se agregaron ${elegidos.length}.`);
  for (const archivo of elegidos) {
    try {
      const blob = await comprimir(archivo, activos ? 1400 : 720, activos ? 0.84 : 0.72);
      f.imagenes.push({ tipo: 'nueva', blob, url: URL.createObjectURL(blob) });
      f.cambiado = true;
    } catch {
      aviso(`No se pudo leer «${archivo.name}». Usa una foto JPG, PNG o WebP.`);
    }
  }
  if (estado.form === f && estado.vista.nombre === 'formulario') refrescarRanuras();
}

async function ponerLogo(archivo) {
  const f = estado.formNegocio;
  if (!f) return;
  try {
    const blob = await comprimir(archivo, activos ? 600 : 320, activos ? 0.88 : 0.8);
    if (f.logo?.tipo === 'nueva') URL.revokeObjectURL(f.logo.url);
    f.logo = { tipo: 'nueva', blob, url: URL.createObjectURL(blob) };
    f.cambiado = true;
    if (estado.formNegocio === f && estado.vista.nombre === 'negocio-form') refrescarLogo();
  } catch {
    aviso(`No se pudo leer «${archivo.name}». Usa una imagen JPG, PNG o WebP.`);
  }
}

function mensajeDeError(error) {
  const codigo = error?.code;
  if (codigo === 'quota_exceeded' || codigo === 'quota_or_state') return 'No queda espacio para más registros o imágenes. Elimina alguno y vuelve a intentar.';
  if (codigo === 'too_large') return 'Una de las imágenes es demasiado pesada. Prueba con otra.';
  if (codigo === 'rate_limited' || codigo === 'resource_exhausted') return 'Demasiados cambios seguidos. Espera unos segundos y vuelve a intentar.';
  if (codigo === 'invalid_argument' || codigo === 'not_granted') return 'Tu acceso a esta vitrina es solo de lectura.';
  return 'No se pudo guardar. Revisa tu conexión y vuelve a intentar.';
}

async function subirImagen(img) {
  if (img.tipo === 'guardada') return img.ref;
  if (activos) {
    const resultado = await activos.upload(img.blob, { type: 'image/jpeg' });
    return resultado.id;
  }
  return blobADataUrl(img.blob);
}

async function guardar() {
  const f = estado.form;
  const { valido, precio } = validar();
  if (!valido) {
    renderFormulario();
    const primero = f.errores.nombre ? 'campo-nombre' : 'campo-precio';
    document.getElementById(primero)?.focus();
    return;
  }
  estado.ocupado = true;
  renderFormulario();
  try {
    const refs = [];
    for (const img of f.imagenes) {
      const ref = await subirImagen(img);
      if (img.tipo === 'nueva') { URL.revokeObjectURL(img.url); Object.assign(img, { tipo: 'guardada', ref }); }
      refs.push(ref);
    }
    const ahora = new Date().toISOString();
    const datos = {
      nombre: f.nombre.trim(),
      descripcion: f.descripcion.trim(),
      precio,
      imagenes: refs,
      ejemplo: false,
      creado: f.original?.creado || ahora,
      actualizado: f.id ? ahora : null
    };
    const id = await almacenes.productos.guardar(f.id, datos);
    const descartadas = (f.original?.imagenes || []).filter(ref => !refs.includes(ref));
    borrarImagenes(descartadas);
    estado.ocupado = false;
    const eraNuevo = !f.id;
    liberarFormulario();
    ir({ nombre: 'detalle', id });
    aviso(eraNuevo ? 'Producto registrado' : 'Cambios guardados');
  } catch (error) {
    estado.ocupado = false;
    renderFormulario();
    aviso(mensajeDeError(error));
  }
}

async function guardarNegocio() {
  const f = estado.formNegocio;
  if (!validarNegocio()) {
    renderFormNegocio();
    const primero = ['nombre', 'direccion', 'telefono', 'responsable'].find(campo => f.errores[campo]);
    document.getElementById(`neg-${primero}`)?.focus();
    return;
  }
  estado.ocupado = true;
  renderFormNegocio();
  try {
    let logo = null;
    if (f.logo) {
      logo = await subirImagen(f.logo);
      if (f.logo.tipo === 'nueva') { URL.revokeObjectURL(f.logo.url); f.logo = { tipo: 'guardada', ref: logo }; }
    }
    const ahora = new Date().toISOString();
    const datos = {
      nombre: f.nombre.trim(),
      logo,
      direccion: f.direccion.trim(),
      telefono: f.telefono.trim(),
      responsable: f.responsable.trim(),
      creado: f.original?.creado || ahora,
      actualizado: f.id ? ahora : null
    };
    await almacenes.negocios.guardar(f.id, datos);
    if (f.original?.logo && f.original.logo !== logo) borrarImagenes([f.original.logo]);
    estado.ocupado = false;
    const eraNuevo = !f.id;
    liberarFormNegocio();
    ir({ nombre: 'negocios' });
    aviso(eraNuevo ? 'Negocio registrado' : 'Cambios guardados');
  } catch (error) {
    estado.ocupado = false;
    renderFormNegocio();
    aviso(mensajeDeError(error));
  }
}

function borrarImagenes(refs) {
  if (!activos) return;
  refs.filter(ref => !/^(data:|blob:|ejemplo:)/.test(ref)).forEach(ref => activos.delete(ref).catch(() => {}));
}

async function eliminar() {
  const p = productoPorId(estado.vista.id);
  if (!p) return;
  estado.ocupado = true;
  renderHoja();
  try {

async function eliminarNegocio() {

function recibir(productos) {

  if (estado.vista.nombre === 'lista') refrescarRejilla();
  else if (estado.vista.nombre === 'catalogo') refrescarCatalogo();
  else if (estado.vista.nombre === 'detalle' && !estado.hoja && anterior !== JSON.stringify(productoPorId(estado.vista.id))) renderDetalle();
}

function recibirNegocios(negocios) {

function crearAlmacenDb(db, nombreColeccion) {
  const coleccion = db.collection(nombreColeccion);
  return {
    escuchar(alRecibir, alFallar) {
      return coleccion.orderBy('creado', 'desc').onSnapshot(
        instantanea => alRecibir(instantanea.docs.map(d => ({ ...d.data(), id: d.id }))),
        alFallar
      );
    },
    async guardar(id, datos) {
      const ref = id ? coleccion.doc(id) : coleccion.doc();
      await ref.set(datos);
      return ref.id;
    },
    async eliminar(id) {
      await coleccion.doc(id).delete();
    }
  };
}

function crearAlmacenLocal(clave, iniciales) {
  let items = null;
  try { items = JSON.parse(localStorage.getItem(clave) || 'null'); } catch { items = null; }
  if (!Array.isArray(items)) items = iniciales.map(item => ({ ...item }));
  let alRecibir = () => {};
  const persistir = () => {
    try { localStorage.setItem(clave, JSON.stringify(items)); }
    catch { aviso('Este navegador no tiene espacio para guardar más imágenes.'); }
  };
  return {
    escuchar(callback) { alRecibir = callback; callback(items.slice()); return () => {}; },
    async guardar(id, datos) {
      if (id) items = items.map(item => (item.id === id ? { ...datos, id } : item));
      else { id = 'p' + Date.now().toString(36); items = [{ ...datos, id }, ...items]; }
      persistir();
      alRecibir(items.slice());
      return id;
    },
    async eliminar(id) {
      items = items.filter(item => item.id !== id);
      persistir();
      alRecibir(items.slice());
    }
  };
}

function enListado() {
  return ['lista', 'catalogo', 'negocios'].includes(estado.vista.nombre);
}

function usarLocal() {
  almacenes = {
    productos: crearAlmacenLocal('vitrina-productos', EJEMPLOS_LOCALES),
    negocios: crearAlmacenLocal('vitrina-negocios', [])
  };
  estado.modo = 'local';
  if (enListado()) render();
  almacenes.productos.escuchar(recibir);
  almacenes.negocios.escuchar(recibirNegocios);
}

async function iniciar() {
  render();
  const claude = window.claude;
  if (!claude?.use) { usarLocal(); return; }
  const pedir = nombre => claude.use(nombre).catch(() => null);
  const [db, assets, user] = await Promise.all([pedir('db'), pedir('assets'), pedir('user')]);
  if (!db) { usarLocal(); return; }
  activos = assets;
  if (user) {
    try { if ((await user.can('data.write')) === false) estado.puedeEditar = false; } catch {}
  }
  almacenes = {
    productos: crearAlmacenDb(db, 'productos'),
    negocios: crearAlmacenDb(db, 'negocios')
  };
  estado.modo = 'db';
  if (enListado()) render();
  const alFallar = () => aviso('Se perdió la conexión con tus datos. Recarga la página.');
  almacenes.productos.escuchar(recibir, alFallar);
  almacenes.negocios.escuchar(recibirNegocios, alFallar);
}

function pedirConfirmacionSalida(accion) {
  estado.hoja = { titulo: '¿Salir sin guardar?', texto: 'Perderás los cambios que hiciste en este formulario.', cancelar: 'Seguir editando', confirmar: 'Salir', accion };
  renderHoja();
}

document.addEventListener('click', evento => {
  const el = evento.target.closest('[data-accion]');
  if (!el) return;
  const accion = el.dataset.accion;
  if (accion === 'seccion') cambiarSeccion(el.dataset.seccion);
  else if (accion === 'nuevo') abrirFormulario(null);
  else if (accion === 'ver') ir({ nombre: 'detalle', id: el.dataset.id });
  else if (accion === 'volver') ir({ nombre: 'lista' });
  else if (accion === 'editar') abrirFormulario(productoPorId(estado.vista.id));
  else if (accion === 'agregar-foto') { selector.value = ''; selector.click(); }
  else if (accion === 'quitar-foto') {
    const [quitada] = estado.form.imagenes.splice(Number(el.dataset.indice), 1);
    if (quitada?.tipo === 'nueva') URL.revokeObjectURL(quitada.url);
    estado.form.cambiado = true;
    refrescarRanuras();
  } else if (accion === 'portada') {
    const indice = Number(el.dataset.indice);
    if (indice > 0) {
      const [elegida] = estado.form.imagenes.splice(indice, 1);
      estado.form.imagenes.unshift(elegida);
      estado.form.cambiado = true;
      refrescarRanuras();
    }
  } else if (accion === 'cancelar') {
    if (estado.form?.cambiado) pedirConfirmacionSalida('confirmar-salir');
    else salirFormulario();
  } else if (accion === 'confirmar-salir') salirFormulario();
  else if (accion === 'pedir-eliminar') {
    const p = productoPorId(estado.vista.id);
    estado.hoja = { titulo: '¿Eliminar este producto?', texto: `«${p.nombre}» y sus fotos se borrarán de tu vitrina. No se puede deshacer.`, cancelar: 'Cancelar', confirmar: 'Eliminar', accion: 'confirmar-eliminar' };
    renderHoja();
  } else if (accion === 'confirmar-eliminar') eliminar();
  else if (accion === 'nuevo-negocio') abrirFormNegocio(null);
  else if (accion === 'editar-negocio') abrirFormNegocio(negocioPorId(el.dataset.id));
  else if (accion === 'elegir-logo') { selectorLogo.value = ''; selectorLogo.click(); }
  else if (accion === 'quitar-logo') {
    const logo = estado.formNegocio.logo;
    if (logo?.tipo === 'nueva') URL.revokeObjectURL(logo.url);
    estado.formNegocio.logo = null;
    estado.formNegocio.cambiado = true;
    refrescarLogo();
  } else if (accion === 'cancelar-negocio') {
    if (estado.formNegocio?.cambiado) pedirConfirmacionSalida('confirmar-salir-negocio');
    else salirFormNegocio();
  } else if (accion === 'confirmar-salir-negocio') salirFormNegocio();
  else if (accion === 'pedir-eliminar-negocio') {
    const n = negocioPorId(estado.formNegocio?.id);
    if (!n) return;
    estado.hoja = { titulo: '¿Eliminar este negocio?', texto: `«${n.nombre}» y su logo se borrarán. No se puede deshacer.`, cancelar: 'Cancelar', confirmar: 'Eliminar', accion: 'confirmar-eliminar-negocio' };
    renderHoja();
  } else if (accion === 'confirmar-eliminar-negocio') eliminarNegocio();
  else if (accion === 'cerrar-hoja' && !estado.ocupado) { estado.hoja = null; renderHoja(); }
});

const CAMPOS_PRODUCTO = { 'campo-nombre': 'nombre', 'campo-descripcion': 'descripcion', 'campo-precio': 'precio' };
const CAMPOS_NEGOCIO = { 'neg-nombre': 'nombre', 'neg-direccion': 'direccion', 'neg-telefono': 'telefono', 'neg-responsable': 'responsable' };

document.addEventListener('input', evento => {
  const objetivo = evento.target;
  if (objetivo.id === 'buscar') { estado.busqueda = objetivo.value; refrescarRejilla(); return; }
  if (objetivo.id === 'buscar-web') { estado.busqueda = objetivo.value; refrescarCatalogo(); return; }
  if (objetivo.id === 'buscar-negocio') { estado.busquedaNegocios = objetivo.value; refrescarNegocios(); return; }
  let f = null;
  let campo = null;
  let prefijo = '';
  if (CAMPOS_PRODUCTO[objetivo.id] && estado.form) { f = estado.form; campo = CAMPOS_PRODUCTO[objetivo.id]; }
  else if (CAMPOS_NEGOCIO[objetivo.id] && estado.formNegocio) { f = estado.formNegocio; campo = CAMPOS_NEGOCIO[objetivo.id]; prefijo = 'neg-'; }
  if (!f) return;
  f[campo] = objetivo.value;
  f.cambiado = true;
  if (objetivo.id === 'campo-descripcion') document.getElementById('contador-descripcion').textContent = `${objetivo.value.length}/${MAX_DESCRIPCION}`;
  if (f.errores[campo]) {
    delete f.errores[campo];
    objetivo.removeAttribute('aria-invalid');
    objetivo.removeAttribute('aria-describedby');
    document.getElementById(`error-${prefijo}${campo}`)?.remove();
  }
});

document.addEventListener('submit', evento => {
  const id = evento.target.id;
  if (id !== 'formulario' && id !== 'formulario-negocio') return;
  evento.preventDefault();
  if (estado.ocupado) return;
  if (id === 'formulario') guardar();
  else guardarNegocio();
});

document.addEventListener('keydown', evento => {
  if (evento.key === 'Escape' && estado.hoja && !estado.ocupado) { estado.hoja = null; renderHoja(); }
});

selector.addEventListener('change', () => {
  const archivos = Array.from(selector.files || []);
  if (archivos.length) agregarFotos(archivos);
});

selectorLogo.addEventListener('change', () => {
  const archivo = selectorLogo.files?.[0];
  if (archivo) ponerLogo(archivo);
});

iniciar();
</script>
